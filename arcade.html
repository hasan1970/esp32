<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Arcade</title>
<style>
  :root {
    --bg: #06060c; --panel: #0e0e18; --line: #22223a; --ink: #e9e9f7; --muted: #7c7c9c;
    --cyan: #27e1ff; --pink: #ff3d9a; --lime: #b6ff3b; --amber: #ffb13b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 16px;
          max-width: 1280px; margin: 0 auto; padding: 16px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 14px;
           border: 1px solid var(--line); background: #05050a; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  h1 { font-size: 22px; letter-spacing: .3em; margin: 0; color: var(--cyan);
       text-shadow: 0 0 12px rgba(39, 225, 255, .6); }
  .sub { color: var(--muted); margin-top: 2px; }
  h2 { font-size: 11px; letter-spacing: .15em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  button#connect { width: 100%; margin-top: 12px; padding: 9px; border-radius: 8px; cursor: pointer;
                   font: inherit; font-weight: 700; letter-spacing: .1em; color: #05050a;
                   background: var(--cyan); border: 0; box-shadow: 0 0 16px rgba(39, 225, 255, .35); }
  button#connect:disabled { opacity: .45; box-shadow: none; cursor: default; }
  #status { color: var(--muted); margin-top: 8px; font-size: 12px; }
  .row { display: flex; gap: 14px; align-items: center; justify-content: space-around; }
  .pad, .knob { position: relative; width: 88px; height: 88px; border-radius: 50%; border: 1.5px solid var(--line); }
  .pad::before, .pad::after { content: ""; position: absolute; background: var(--line); }
  .pad::before { left: 50%; top: 6px; bottom: 6px; width: 1px; }
  .pad::after { top: 50%; left: 6px; right: 6px; height: 1px; }
  .pad .dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; left: 50%; top: 50%;
              border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); z-index: 1; }
  .knob { transition: transform .08s; }
  .knob .tick { position: absolute; left: 50%; top: 6px; width: 4px; height: 22px; margin-left: -2px;
                border-radius: 2px; background: var(--pink); box-shadow: 0 0 10px var(--pink); }
  .cap { text-align: center; color: var(--muted); font-size: 11px; margin-top: 6px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .b { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px;
       border: 1px solid var(--line); color: var(--muted); font-size: 11px; transition: all .06s; }
  .b i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
  .b.on { color: var(--lime); border-color: var(--lime); box-shadow: 0 0 12px rgba(182, 255, 59, .35); }
  .b.on i { background: var(--lime); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
  dt { color: var(--amber); } dd { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="1600" height="1000"></canvas>

  <aside>
    <div class="card">
      <h1>ORBIT</h1>
      <div class="sub">Nano arcade · 4 inputs</div>
      <button id="connect">CONNECT NANO</button>
      <div id="status">Keyboard works too — or connect the Nano.</div>
    </div>

    <div class="card">
      <h2>LIVE INPUTS</h2>
      <div class="row">
        <div><div class="pad"><div class="dot" id="dot"></div></div><div class="cap">joystick</div></div>
        <div><div class="knob" id="knob"><div class="tick"></div></div><div class="cap" id="enccap">knob 0</div></div>
      </div>
      <div class="btns">
        <div class="b" id="i-b1"><i></i>B1 · FIRE</div>
        <div class="b" id="i-b2"><i></i>B2 · BOMB</div>
        <div class="b" id="i-sw"><i></i>STICK · DASH</div>
        <div class="b" id="i-eb"><i></i>KNOB · PAUSE</div>
      </div>
    </div>

    <div class="card">
      <h2>CONTROLS</h2>
      <dl>
        <dt>Joystick</dt><dd>fly · WASD</dd>
        <dt>Knob</dt><dd>aim the cannon · Q / E</dd>
        <dt>B1 hold</dt><dd>fire · Space</dd>
        <dt>B2</dt><dd>nova bomb · B</dd>
        <dt>Stick click</dt><dd>dash · Shift</dd>
        <dt>Knob push</dt><dd>start / pause · P</dd>
      </dl>
    </div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("game"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height, TAU = Math.PI * 2;

/* ---------- input: Nano over Web Serial, keyboard as fallback ---------- */

const input = { jx: 0, jy: 0, enc: 0, fire: false };
const kb = { keys: new Set(), aim: 0 };
let prev = null, center = null;

function deadzone(v) { return Math.abs(v) < 0.12 ? 0 : (v - Math.sign(v) * 0.12) / 0.88; }

function onNano(d) {
  const max = d.max ?? 1023;
  center ??= { x: d.x, y: d.y };  // first reading = stick at rest
  const norm = (v, c) => v < c ? (v - c) / c : (v - c) / (max - c);
  input.jx = deadzone(norm(d.x, center.x));
  input.jy = deadzone(norm(d.y, center.y));
  input.enc = d.enc ?? 0;
  input.fire = !!d.b1;

  // Press counts from the Nano: act once per new press. A lower count = Nano restarted.
  if (prev && d.b1n >= prev.b1n) {
    if (d.b1n > prev.b1n || d.b2n > prev.b2n) startIfIdle();
    if (d.b2n > prev.b2n) bomb();
    if (d.swn > prev.swn) dash();
    if (d.ebn > prev.ebn) togglePause();
  }
  prev = d;

  $("dot").style.left = 50 + input.jx * 40 + "%";
  $("dot").style.top = 50 + input.jy * 40 + "%";
  $("knob").style.transform = `rotate(${input.enc * 18}deg)`;
  $("enccap").textContent = "knob " + input.enc;
  for (const k of ["b1", "b2", "sw", "eb"]) $("i-" + k).classList.toggle("on", !!d[k]);
}

$("connect").onclick = async () => {
  initAudio();
  if (!("serial" in navigator)) { $("status").textContent = "Needs Chrome or Edge for Web Serial."; return; }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    await port.setSignals({ dataTerminalReady: false, requestToSend: false });
    $("connect").disabled = true;
    $("status").textContent = "Connected — keep the stick centred for a sec…";
    prev = center = null;
    const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        try { onNano(JSON.parse(line)); $("status").textContent = "Nano connected · live"; } catch {}
      }
    }
  } catch (e) {
    $("status").textContent = "Error: " + e.message + " (close other tabs / controller.py)";
  }
  $("connect").disabled = false;
};

addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  initAudio();
  kb.keys.add(e.code);
  if (e.code === "Space" || e.code === "KeyB") startIfIdle();
  if (e.code === "KeyB") bomb();
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") dash();
  if (e.code === "KeyP") togglePause();
  if (e.code === "KeyQ") kb.aim--;
  if (e.code === "KeyE") kb.aim++;
});
addEventListener("keyup", e => kb.keys.delete(e.code));

function controls() {
  const k = c => kb.keys.has(c) ? 1 : 0;
  const kx = k("KeyD") + k("ArrowRight") - k("KeyA") - k("ArrowLeft");
  const ky = k("KeyS") + k("ArrowDown") - k("KeyW") - k("ArrowUp");
  return {
    x: Math.max(-1, Math.min(1, input.jx + kx)),
    y: Math.max(-1, Math.min(1, input.jy + ky)),
    aim: (input.enc + kb.aim) * TAU / 20 - Math.PI / 2,  // 20 clicks per turn, click 0 = up
    fire: input.fire || kb.keys.has("Space"),
  };
}

/* ---------- sound ---------- */

let ac = null;
function initAudio() { ac ??= new (window.AudioContext || window.webkitAudioContext)(); }
function blip(freq, dur = 0.08, type = "square", vol = 0.05, slide = 0.5) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur);
}

/* ---------- game ---------- */

let state = "title", g;
const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() }));

function newGame() {
  g = {
    ship: { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, inv: 2, dashT: 0, dashCd: 0 },
    bullets: [], enemies: [], sparks: [], rings: [],
    score: 0, lives: 3, bombs: 2, wave: 1, waveT: 0, spawnT: 1, fireCd: 0, shake: 0, banner: 2.2,
  };
}

function startIfIdle() {
  if (state === "title" || state === "over") { newGame(); state = "play"; blip(220, 0.4, "sawtooth", 0.05, 4); }
}
function togglePause() {
  if (state === "title" || state === "over") return startIfIdle();
  state = state === "play" ? "pause" : "play";
  blip(state === "pause" ? 440 : 660, 0.1, "triangle", 0.06, 1);
}
function bomb() {
  if (state !== "play" || g.bombs <= 0) return;
  g.bombs--;
  g.rings.push({ x: g.ship.x, y: g.ship.y, r: 20, max: 520 });
  g.shake = 18;
  blip(120, 0.7, "sawtooth", 0.09, 0.2);
}
function dash() {
  if (state !== "play" || g.ship.dashCd > 0) return;
  const c = controls(), s = g.ship;
  const len = Math.hypot(c.x, c.y);
  const dx = len > 0.1 ? c.x / len : Math.cos(s.a), dy = len > 0.1 ? c.y / len : Math.sin(s.a);
  s.vx = dx * 1700; s.vy = dy * 1700;
  s.dashT = 0.18; s.dashCd = 0.9; s.inv = Math.max(s.inv, 0.35);
  blip(900, 0.15, "triangle", 0.05, 0.3);
}

function burst(x, y, color, n = 16, speed = 420) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = speed * (0.3 + Math.random());
    g.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.5, color });
  }
}

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4), m = 40;
  const x = side === 0 ? -m : side === 1 ? W + m : Math.random() * W;
  const y = side === 2 ? -m : side === 3 ? H + m : Math.random() * H;
  const roll = Math.random();
  const kind = g.wave >= 3 && roll < 0.2 ? "tank" : g.wave >= 2 && roll < 0.5 ? "splitter" : "drone";
  const base = { drone: [22, 1, 150, "#ff3d9a"], splitter: [30, 2, 110, "#ffb13b"], tank: [44, 6, 70, "#b36bff"] }[kind];
  g.enemies.push({ kind, x, y, r: base[0], hp: base[1], speed: base[2] + g.wave * 12,
                   color: base[3], spin: Math.random() * TAU, wob: Math.random() * TAU });
}

function killEnemy(e, i) {
  g.enemies.splice(i, 1);
  g.score += { drone: 10, splitter: 25, tank: 60 }[e.kind] * g.wave;
  burst(e.x, e.y, e.color, e.kind === "tank" ? 40 : 18);
  blip(e.kind === "tank" ? 90 : 180 + Math.random() * 80, 0.18, "square", 0.05, 0.3);
  if (e.kind === "splitter") {
    for (const s of [-1, 1]) g.enemies.push({ kind: "drone", x: e.x + s * 14, y: e.y, r: 16, hp: 1,
      speed: 200 + g.wave * 12, color: "#ff3d9a", spin: 0, wob: Math.random() * TAU });
  }
}

function update(dt) {
  const c = controls(), s = g.ship;

  // Ship: joystick sets target velocity, dash overrides briefly.
  s.dashT -= dt; s.dashCd -= dt; s.inv -= dt;
  if (s.dashT <= 0) {
    const k = Math.min(1, dt * 10);
    s.vx += (c.x * 560 - s.vx) * k;
    s.vy += (c.y * 560 - s.vy) * k;
  }
  s.x = Math.max(24, Math.min(W - 24, s.x + s.vx * dt));
  s.y = Math.max(24, Math.min(H - 24, s.y + s.vy * dt));
  if (s.dashT > 0) g.sparks.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 0.25, color: "#27e1ff" });

  // Cannon: eases toward the knob angle along the shortest way round.
  let da = (c.aim - s.a) % TAU;
  if (da > Math.PI) da -= TAU; if (da < -Math.PI) da += TAU;
  s.a += da * Math.min(1, dt * 16);

  g.fireCd -= dt;
  if (c.fire && g.fireCd <= 0) {
    g.fireCd = 0.1;
    const nx = Math.cos(s.a), ny = Math.sin(s.a);
    g.bullets.push({ x: s.x + nx * 30, y: s.y + ny * 30, vx: nx * 1250, vy: ny * 1250, life: 0.9 });
    blip(1300, 0.05, "square", 0.025, 0.6);
  }

  // Waves: every 25 s, faster spawns, +1 bomb.
  g.waveT += dt; g.banner -= dt;
  if (g.waveT > 25) { g.wave++; g.waveT = 0; g.bombs = Math.min(5, g.bombs + 1); g.banner = 2.2; blip(330, 0.5, "triangle", 0.06, 2); }
  g.spawnT -= dt;
  if (g.spawnT <= 0) { spawnEnemy(); g.spawnT = Math.max(0.25, 1.3 - g.wave * 0.12) * (0.6 + Math.random() * 0.8); }

  for (const b of g.bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
  g.bullets = g.bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  for (let i = g.enemies.length - 1; i >= 0; i--) {
    const e = g.enemies[i];
    e.wob += dt * 3; e.spin += dt * 2;
    const a = Math.atan2(s.y - e.y, s.x - e.x) + Math.sin(e.wob) * 0.5;
    e.x += Math.cos(a) * e.speed * dt; e.y += Math.sin(a) * e.speed * dt;

    for (let j = g.bullets.length - 1; j >= 0; j--) {
      const b = g.bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 6) {
        g.bullets.splice(j, 1);
        burst(b.x, b.y, e.color, 4, 220);
        if (--e.hp <= 0) { killEnemy(e, i); break; }
      }
    }
    if (!g.enemies.includes(e)) continue;

    if (s.inv <= 0 && Math.hypot(s.x - e.x, s.y - e.y) < e.r + 18) {
      killEnemy(e, i);
      g.lives--; s.inv = 2; g.shake = 22;
      burst(s.x, s.y, "#27e1ff", 50, 600);
      blip(70, 0.6, "sawtooth", 0.1, 0.4);
      if (g.lives <= 0) { state = "over"; return; }
    }
  }

  for (const r of g.rings) {
    r.r += 1400 * dt;
    for (let i = g.enemies.length - 1; i >= 0; i--) {
      const e = g.enemies[i];
      if (Math.hypot(e.x - r.x, e.y - r.y) < r.r) killEnemy(e, i);
    }
  }
  g.rings = g.rings.filter(r => r.r < r.max);

  for (const p of g.sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  g.sparks = g.sparks.filter(p => p.life > 0);
  g.shake *= 0.88;
}

/* ---------- drawing ---------- */

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.strokeStyle = color; ctx.fillStyle = color; }

function poly(x, y, r, sides, rot) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rot + i * TAU / sides;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}

function text(str, x, y, size, color, align = "center") {
  ctx.font = `700 ${size}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = align; glow(color, 18); ctx.fillText(str, x, y);
}

function draw(t) {
  // Translucent clear = motion trails.
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(5, 5, 10, 0.34)";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (g && g.shake > 0.5) ctx.translate((Math.random() - 0.5) * g.shake, (Math.random() - 0.5) * g.shake);

  // Stars drift opposite to the ship's motion.
  const drift = g && state === "play" ? g.ship : { vx: 30, vy: 10 };
  ctx.fillStyle = "#8a8ab8";
  for (const st of stars) {
    st.x = (st.x - drift.vx * 0.004 * st.z + W) % W;
    st.y = (st.y - drift.vy * 0.004 * st.z + H) % H;
    ctx.globalAlpha = 0.25 + st.z * 0.6;
    ctx.fillRect(st.x, st.y, 1 + st.z * 2, 1 + st.z * 2);
  }
  ctx.globalAlpha = 1;

  // Grid
  ctx.strokeStyle = "rgba(39, 225, 255, 0.05)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 80) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  if (g) {
    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = 3;

    for (const r of g.rings) {
      glow("#b6ff3b", 30); ctx.globalAlpha = 1 - r.r / r.max;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const p of g.sparks) {
      glow(p.color, 10); ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    glow("#b6ff3b", 16);
    for (const b of g.bullets) { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.018, b.y - b.vy * 0.018); ctx.stroke(); }

    for (const e of g.enemies) {
      glow(e.color, 22);
      const sides = { drone: 3, splitter: 4, tank: 6 }[e.kind];
      poly(e.x, e.y, e.r, sides, e.spin); ctx.stroke();
      if (e.kind === "tank") { poly(e.x, e.y, e.r * 0.5, 6, -e.spin); ctx.stroke(); }
    }

    // Ship (blinks while invulnerable)
    const s = g.ship;
    if (s.inv <= 0 || Math.floor(t / 90) % 2) {
      glow("#27e1ff", 26);
      ctx.beginPath(); ctx.arc(s.x, s.y, 18, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, TAU); ctx.fill();
      // Cannon points where the knob says
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(s.x + Math.cos(s.a) * 14, s.y + Math.sin(s.a) * 14);
      ctx.lineTo(s.x + Math.cos(s.a) * 36, s.y + Math.sin(s.a) * 36); ctx.stroke();
      // Aim guide
      ctx.lineWidth = 1.5; ctx.globalAlpha = 0.25; ctx.setLineDash([6, 12]);
      ctx.beginPath(); ctx.moveTo(s.x + Math.cos(s.a) * 44, s.y + Math.sin(s.a) * 44);
      ctx.lineTo(s.x + Math.cos(s.a) * 260, s.y + Math.sin(s.a) * 260); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.restore();

  // HUD
  if (g && state !== "title") {
    text(String(g.score).padStart(6, "0"), 40, 64, 40, "#e9e9f7", "left");
    text("WAVE " + g.wave, W - 40, 64, 28, "#ffb13b", "right");
    text("♥ ".repeat(g.lives).trim(), 40, 110, 26, "#ff3d9a", "left");
    text("◉ ".repeat(g.bombs).trim() || "–", W - 40, 110, 26, "#b6ff3b", "right");
    if (g.banner > 0 && state === "play") { ctx.globalAlpha = Math.min(1, g.banner); text("WAVE " + g.wave, W / 2, H / 2 - 160, 72, "#ffb13b"); ctx.globalAlpha = 1; }
  }
  if (state === "title") {
    text("O R B I T", W / 2, H / 2 - 40, 130, "#27e1ff");
    text("fly with the stick · aim with the knob · hold B1 to fire", W / 2, H / 2 + 40, 28, "#7c7c9c");
    if (Math.floor(t / 500) % 2) text("PRESS B1 OR THE KNOB TO START", W / 2, H / 2 + 130, 34, "#b6ff3b");
  } else if (state === "pause") {
    text("PAUSED", W / 2, H / 2, 110, "#e9e9f7");
    text("push the knob to resume", W / 2, H / 2 + 70, 28, "#7c7c9c");
  } else if (state === "over") {
    text("GAME OVER", W / 2, H / 2 - 30, 120, "#ff3d9a");
    text("score " + g.score + " · wave " + g.wave, W / 2, H / 2 + 50, 36, "#e9e9f7");
    if (Math.floor(t / 500) % 2) text("PRESS B1 TO PLAY AGAIN", W / 2, H / 2 + 140, 32, "#b6ff3b");
  }
  ctx.shadowBlur = 0;
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  if (state === "play") update(dt);
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
